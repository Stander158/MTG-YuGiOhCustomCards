# Custom set: "MTG"
# 0xa57 was verified unused across 22,689 cards and 741 setcodes in every
# shipped database, checked on the low 12 bits so all 16 subtype nibbles are
# covered. One flat setcode is enough: the cards name individual lands rather
# than referring to "land" as a group.

!setname 0xa57 MTG

# Reusing 0xa57 as the counter code -- free there too, and keeping the two the
# same makes the set's numbers self-documenting.

!counter 0xa57 Wandering Emperor Counter
